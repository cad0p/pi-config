packages: []
# Build-script approval (pnpm 11, same convention as the pi extension repos):
# genai's postinstall is needed for its JS runtime; protobufjs + glimpseui
# (macos-only optional dep) work without theirs. (The remote pcad-dev copy
# carried pnpm's auto-generated placeholder values — invalid, install fails.)
allowBuilds:
  '@google/genai': true
  glimpseui: false
  protobufjs: false
